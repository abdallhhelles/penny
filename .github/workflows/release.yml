# Publishes a signed Penny update to GitHub Releases when you push a version tag (e.g. v1.9.0).
# Installed copies of Penny check https://github.com/<owner>/<repo>/releases/latest/download/latest.json every 6 hours,
# verify the SHA-256 + Ed25519 signature, and offer "Restart to update".
#
# One-time setup:  repository Settings > Secrets and variables > Actions > New repository secret
#   Name: UPDATE_PRIVATE_KEY   Value: the full contents of tools/update-private-key.pem (BEGIN ... END lines included)
# Each release:     bump "version" in package.json and BRAND in renderer/icons.js, write docs/RELEASE-<version>.md, then
#   git tag v1.9.0 && git push origin v1.9.0
name: Release
on:
  push:
    tags: ['v*.*.*']
  release:
    types: [published, edited]   # also runs when you publish (or fix) a release on github.com
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install (no Electron download needed)
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: npm test
      - name: Translation check
        run: node tools/i18n-check.js
      - name: Release gate
        run: node tools/release-check.js --allow-missing-contact
      - name: Version
        id: v
        run: |
          VER=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then TAG="${{ github.event.release.tag_name }}"; fi
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # accept small tag typos: v1.9.1, v.1.9.1, V1.9.1, 1.9.1
          NORM=$(printf '%s' "$TAG" | sed -E 's/^[vV]?[.-]?//')
          if [ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ] && [ "$NORM" != "$VER" ]; then
            echo "::error::Release tag $TAG does not match the app version $VER in package.json. Use the tag v$VER."; exit 1
          fi
      - name: Build and sign the update
        env:
          KEY: ${{ secrets.UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::error::Add the UPDATE_PRIVATE_KEY repository secret (see the top of this file)"; exit 1; fi
          umask 077
          printf '%s\n' "$KEY" > tools/update-private-key.pem
          NOTES="docs/RELEASE-${{ steps.v.outputs.ver }}.md"
          if [ -f "$NOTES" ]; then node tools/publish-update.js out --notes-file "$NOTES"
          else node tools/publish-update.js out --notes "Penny ${{ steps.v.outputs.ver }}"; fi
      - name: Remove the signing key
        if: always()
        run: rm -f tools/update-private-key.pem
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=${{ steps.v.outputs.ver }}
          NOTES="docs/RELEASE-$VER.md"
          ARGS=(--title "Penny $VER" --latest)
          if [ -f "$NOTES" ]; then ARGS+=(--notes-file "$NOTES"); else ARGS+=(--notes "Penny $VER"); fi
          TAG="${{ steps.v.outputs.tag }}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ -z "$TAG" ]; then TAG="v$VER"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "out/penny-app-$VER.pkg" "out/latest.json" --clobber
          else
            gh release create "$TAG" "out/penny-app-$VER.pkg" "out/latest.json" "${ARGS[@]}"
          fi
          echo "Installed copies will find it at https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"
